<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker - Price Entry</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon-precomposed.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold mb-2">Price Entry</h1>
                <p class="text-secondary">Add daily closing prices for stocks</p>
            </div>
            <button onclick="toggleTheme()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <!-- Navigation - injected by navigation.js -->
        <div id="navigation"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Price Form -->
            <div class="lg:col-span-2">
                <div class="card rounded-xl p-6 shadow-lg">
                    <h3 class="text-xl font-bold mb-4">Add Daily Price</h3>
                    <form id="priceForm">
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Stock</label>
                            <select id="stockSelect" required
                                    class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Select Stock</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Date</label>
                            <input type="date" id="priceDate" required
                                   class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Opening Price</label>
                                <input type="number" step="0.01" min="0" id="openingPrice"
                                       class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Closing Price *</label>
                                <input type="number" step="0.01" min="0.01" id="closingPrice" required
                                       class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">High Price</label>
                                <input type="number" step="0.01" min="0" id="highPrice"
                                       class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Low Price</label>
                                <input type="number" step="0.01" min="0" id="lowPrice"
                                       class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Volume</label>
                            <input type="number" min="0" id="volume"
                                   class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button type="submit" 
                                class="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                            <i class="fas fa-save mr-2"></i>Save Price
                        </button>
                    </form>
                </div>
            </div>

            <!-- Recent Entries -->
            <div>
                <div class="card rounded-xl p-6 shadow-lg">
                    <h3 class="text-xl font-bold mb-4">Recent Entries</h3>
                    <div id="recentEntries">
                        <p class="text-secondary">No recent entries</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Alert -->
    <div id="successAlert" class="fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
        <i class="fas fa-check-circle mr-2"></i>Price saved successfully! RSI calculation triggered.
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
        <i class="fas fa-exclamation-circle mr-2"></i>Error saving price. Please try again.
    </div>

    <script src="js/api.js"></script>
    <script src="js/price-entry.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
//
            rerconst icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }
    </script>
</body>
</html>
