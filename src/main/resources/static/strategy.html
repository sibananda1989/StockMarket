<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Tracker - Strategy Manager</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon-precomposed.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.strategy-toggle { position: relative; width: 44px; height: 24px; background: #374151; border-radius: 12px; cursor: pointer; transition: background 0.3s; flex-shrink: 0; }
.strategy-toggle.active { background: #22c55e; }
.strategy-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform 0.3s; }
.strategy-toggle.active::after { transform: translateX(20px); }
.priority-slider::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
.priority-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: none; }
code { background: #1e293b; padding: 1px 4px; border-radius: 3px; font-size: 0.75rem; color: #93c5fd; }
.toast-notification { animation: slideIn 0.3s ease; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body class="dark min-h-screen">
<div class="container mx-auto px-4 py-8 max-w-7xl">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold"><i class="fas fa-sliders text-blue-400 mr-3"></i>Strategy manager</h1>
            <p class="text-secondary mt-1">Configure signal strategies, conditions, and priorities</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="activeCount" class="px-3 py-1.5 rounded-full text-sm font-medium bg-gray-700 text-gray-200">0 of 5 active</span>
            <button id="saveBtn" disabled
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors opacity-50 cursor-not-allowed">
                <i class="fas fa-floppy-disk mr-2"></i>Save
            </button>
        </div>
    </div>

    <div id="navigation"></div>

    <div class="card rounded-xl shadow-lg overflow-hidden">
        <div id="strategyList" class="divide-y divide-gray-700"></div>
    </div>

    <div class="flex items-center justify-between mt-6 px-1">
        <div class="flex items-start gap-2 text-sm text-gray-400">
            <i class="fas fa-info-circle mt-0.5"></i>
            <span>Priority (1–10) controls each strategy's weight in the aggregated signal.</span>
        </div>
        <button id="resetLink" class="text-sm text-red-400 hover:text-red-300 transition-colors">
            <i class="fas fa-rotate-left mr-1"></i>Reset to defaults
        </button>
    </div>
</div>

<script>document.write('<script src="js/api.js?_=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="js/navigation.js?_=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="strategy-manager.js?_=' + Date.now() + '"><\/script>');</script>
</body>
</html>
