# Shadow Signal Configuration
shadow.signal.enabled=true
shadow.signal.version=old-logic

# Async execution configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Scheduling configuration
shadow.signal.cron=0 0 9 * * ?

# Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=stockmarket

# Database
spring.datasource.hikari.maximum-pool-size=10

# Logging
logging.level.org.example.service.ShadowSignalService=INFO
logging.level.org.example.service.SignalComparisonService=INFO