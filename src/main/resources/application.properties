server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/stockmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.context.request.async=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate=ERROR
logging.level.com.stocks=DEBUG

spring.jackson.time-zone=IST

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false

spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-store=true

spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=StockMarketPool

# Multi-Strategy Signal System

# Strategy priorities (1-10, higher = more influential)
strategy.rsi.priority=7
strategy.macd.priority=7
strategy.ma-crossover.priority=8
strategy.bollinger.priority=6
strategy.volume.priority=5

# Aggregator thresholds
strategy.aggregator.buy-threshold=3.0
strategy.aggregator.sell-threshold=-3.0

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.nseSession.base-config=default
resilience4j.circuitbreaker.instances.nseXbrl.base-config=default
resilience4j.timelimiter.configs.default.timeout-duration=30s
logging.level.org.example=DEBUG
logging.level.org.example.service.SignalService=INFO

# Log file output
logging.file.name=logs/stockmarket.log

# Caching configuration for signal computation
spring.cache.type=caffeine
spring.cache.cache-names=signals,signalDto,latestIndicators,indicatorHistory,supportResistanceLevels

# Auto-backfill of price history when indicators fail due to insufficient data
indicator.auto-backfill.enabled=true
indicator.auto-backfill.buffer-days=10
indicator.auto-backfill.max-stocks-per-run=5

spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m,recordStats
